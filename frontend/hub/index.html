<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CataNet | Hub de juegos</title>
  <meta
    name="description"
    content="CataNet es un hub de juegos online para compartir con amigos. Empeza con Co-Wordle y descubri los proximos titulos."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --mint: #c5ebc3;
      --sage: #b7c8b5;
      --mauve: #a790a5;
      --plum: #875c74;
      --eggplant: #54414e;
      --card: #ffffff;
      --radius: 20px;
      --sombra-suave: 0 4px 14px rgba(84, 65, 78, 0.06);
      --sombra-fuerte: 0 22px 50px rgba(84, 65, 78, 0.18);
      --sombra-hover-card: 0 28px 70px rgba(135, 92, 116, 0.34), 0 0 0 1px rgba(135, 92, 116, 0.36), 0 0 34px rgba(197, 235, 195, 0.34);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 400;
      color: var(--eggplant);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      background: #f4edf0;
      background-attachment: fixed;
    }

    a {
      color: inherit;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(135, 92, 116, 0.35);
      outline-offset: 4px;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-scene,
    .bg-trees,
    .bg-river,
    .bg-overlay {
      position: absolute;
      inset: 0;
    }

    /* La ilustracion pixel art lleva el peso visual y se mueve apenas para dar vida. */
    .bg-scene {
      background:
        linear-gradient(180deg, rgba(255, 250, 246, 0.2) 0%, rgba(255, 250, 246, 0.02) 24%, rgba(84, 65, 78, 0.14) 100%),
        radial-gradient(circle at center, rgba(255, 251, 241, 0.12) 0%, rgba(255, 251, 241, 0) 52%),
        url("/hub/assets/hub-pixel-river.png") center center / cover no-repeat;
      transform: scale(1.05);
      filter: saturate(0.92) contrast(1.03);
      animation: escena-flota 12s ease-in-out infinite alternate;
    }

    .bg-overlay {
      background:
        linear-gradient(180deg, rgba(244, 237, 240, 0.62) 0%, rgba(244, 237, 240, 0.18) 30%, rgba(244, 237, 240, 0.3) 100%),
        radial-gradient(circle at 50% 18%, rgba(255, 251, 244, 0.52) 0%, rgba(255, 251, 244, 0.1) 32%, rgba(255, 251, 244, 0) 60%);
    }

    /* Repetimos los laterales del fondo y los enmascaramos para simular copas en movimiento. */
    .bg-trees::before,
    .bg-trees::after {
      content: "";
      position: absolute;
      inset: 0;
      background: url("/hub/assets/hub-pixel-river.png") center center / cover no-repeat;
      filter: saturate(0.98) contrast(1.04);
      opacity: 0.58;
      will-change: transform;
    }

    .bg-trees::before {
      clip-path: polygon(0 0, 24% 0, 33% 100%, 0 100%);
      mask-image: linear-gradient(90deg, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.94) 55%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.94) 55%, rgba(0, 0, 0, 0) 100%);
      transform-origin: 18% 80%;
      animation: arboles-izquierda 3.8s ease-in-out infinite alternate;
    }

    .bg-trees::after {
      clip-path: polygon(73% 0, 100% 0, 100% 100%, 66% 100%);
      mask-image: linear-gradient(270deg, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.94) 55%, rgba(0, 0, 0, 0) 100%);
      -webkit-mask-image: linear-gradient(270deg, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.94) 55%, rgba(0, 0, 0, 0) 100%);
      transform-origin: 82% 80%;
      animation: arboles-derecha 4.2s ease-in-out infinite alternate;
    }

    /* El rio combina un leve corrimiento vertical con brillos que avanzan. */
    .bg-river::before,
    .bg-river::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .bg-river::before {
      background: url("/hub/assets/hub-pixel-river.png") center center / cover no-repeat;
      opacity: 0.3;
      clip-path: polygon(35% 52%, 65% 52%, 82% 100%, 18% 100%);
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.85) 24%, rgba(0, 0, 0, 1) 100%);
      -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.85) 24%, rgba(0, 0, 0, 1) 100%);
      filter: blur(0.2px) brightness(1.03);
      animation: rio-base 3.5s ease-in-out infinite;
    }

    .bg-river::after {
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255, 249, 226, 0.45) 0 4px,
          rgba(255, 249, 226, 0.06) 4px 12px,
          rgba(255, 249, 226, 0) 12px 24px
        ),
        linear-gradient(180deg, rgba(197, 235, 195, 0.12) 0%, rgba(167, 144, 165, 0.22) 100%);
      background-size: 100% 120px, 100% 100%;
      background-position: center 0, center center;
      clip-path: polygon(35% 52%, 65% 52%, 82% 100%, 18% 100%);
      opacity: 0.68;
      mix-blend-mode: screen;
      animation: rio-brillo 2.8s linear infinite;
    }

    .dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(135, 92, 116, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
      opacity: 0.5;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 72px 24px 96px;
    }

    .hero {
      text-align: center;
      margin-bottom: 64px;
      animation: rise 0.8s ease-out both;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(197, 235, 195, 0.9);
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(84, 65, 78, 0.08);
      backdrop-filter: blur(10px);
      font-weight: 500;
      color: var(--plum);
      font-size: 14px;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--plum);
      box-shadow: 0 0 0 4px rgba(135, 92, 116, 0.2);
      animation: heartbeat 1.6s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(40px, 6vw, 64px);
      font-weight: 500;
      color: var(--eggplant);
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 18px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .accent {
      display: inline-block;
      color: var(--plum);
      text-shadow:
        3px 3px 0 rgba(167, 144, 165, 0.72),
        6px 6px 0 rgba(183, 200, 181, 0.7),
        9px 9px 0 rgba(197, 235, 195, 0.68),
        12px 12px 0 rgba(84, 65, 78, 0.2);
      animation: sombras-titulo 1.35s ease-in-out infinite;
      transform-origin: center;
      will-change: transform, text-shadow;
    }

    .subtitle {
      font-size: 17px;
      color: rgba(84, 65, 78, 0.84);
      max-width: 600px;
      margin: 0 auto 20px;
      line-height: 1.6;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .hero-meta {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .hero-pill {
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(135, 92, 116, 0.14);
      background: rgba(255, 255, 255, 0.72);
      color: var(--eggplant);
      font-size: 13px;
      box-shadow: 0 6px 18px rgba(84, 65, 78, 0.06);
      backdrop-filter: blur(10px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 280px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(183, 200, 181, 0.88);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--sombra-suave);
      backdrop-filter: blur(16px);
      transition: box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
      overflow: hidden;
      opacity: 0;
      animation: rise 0.7s ease-out forwards;
    }

    .card:nth-child(1) {
      animation-delay: 0.1s;
    }

    .card:nth-child(2) {
      animation-delay: 0.25s;
    }

    .card:nth-child(3) {
      animation-delay: 0.4s;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(197, 235, 195, 0.68), transparent 58%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
      opacity: 0;
      pointer-events: none;
    }

    .card.locked {
      opacity: 0.9;
    }

    .card:hover,
    .card:focus-within {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(135, 92, 116, 0.58);
      box-shadow: var(--sombra-hover-card);
    }

    .card:hover::before,
    .card:focus-within::before {
      opacity: 0.45;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: transparent;
      border: none;
      display: grid;
      place-items: center;
    }

    .icon img {
      width: 64px;
      height: 64px;
      display: block;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .badge.live {
      background: var(--mint);
      color: var(--eggplant);
    }

    .badge.soon {
      background: #f1eaef;
      color: var(--plum);
      border: 1px solid #e3d4df;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--plum);
      position: relative;
    }

    .live-dot::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: var(--plum);
      opacity: 0.5;
      animation: pulse 1.6s ease-out infinite;
    }

    .card h2 {
      font-size: 22px;
      font-weight: 500;
      color: var(--eggplant);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .card p {
      font-size: 15px;
      color: var(--mauve);
      line-height: 1.6;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .card-footer {
      margin-top: auto;
      position: relative;
      z-index: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      background: linear-gradient(135deg, var(--plum), var(--eggplant));
      color: #ffffff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 500;
      font-size: 14.5px;
      box-shadow: 0 8px 18px rgba(135, 92, 116, 0.35);
      position: relative;
      overflow: hidden;
      isolation: isolate;
      transition: box-shadow 0.25s ease;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -70%;
      width: 44%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.16),
        rgba(255, 255, 255, 0.72),
        rgba(255, 255, 255, 0.16),
        transparent
      );
      opacity: 0;
      transform: translateX(0) skewX(-24deg);
      pointer-events: none;
    }

    .btn:hover,
    .btn:focus-visible {
      box-shadow: 0 12px 28px rgba(135, 92, 116, 0.42);
    }

    .btn:hover::before,
    .btn:focus-visible::before {
      animation: sheen 0.9s linear both;
    }

    .placeholder {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      color: var(--mauve);
      font-style: italic;
      opacity: 0.88;
    }

    .footer {
      text-align: center;
      margin-top: 80px;
      font-size: 13px;
      color: rgba(84, 65, 78, 0.74);
      opacity: 0.85;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      animation: rise 0.8s ease-out 0.45s both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }

    @keyframes escena-flota {
      0% { transform: scale(1.05) translate3d(-8px, 0, 0); filter: saturate(0.9) contrast(1.02); }
      50% { transform: scale(1.07) translate3d(4px, -10px, 0); filter: saturate(0.96) contrast(1.05); }
      100% { transform: scale(1.05) translate3d(10px, -18px, 0); filter: saturate(0.92) contrast(1.03); }
    }

    @keyframes arboles-izquierda {
      0% { transform: translate3d(-14px, 0, 0) rotate(-1deg) scale(1.02); }
      100% { transform: translate3d(12px, -8px, 0) rotate(1.15deg) scale(1.06); }
    }

    @keyframes arboles-derecha {
      0% { transform: translate3d(14px, 0, 0) rotate(1deg) scale(1.02); }
      100% { transform: translate3d(-12px, -8px, 0) rotate(-1.15deg) scale(1.06); }
    }

    @keyframes rio-base {
      0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
      50% { transform: translate3d(0, 18px, 0) scaleY(1.035); }
    }

    @keyframes rio-brillo {
      0% { background-position: center 0, center center; }
      100% { background-position: center 120px, center center; }
    }

    @keyframes sombras-titulo {
      0%, 100% {
        transform: translate(0, 0);
        text-shadow: none;
      }

      10% {
        transform: translate(-3px, -3px);
        text-shadow: 3px 3px 0 rgba(167, 144, 165, 0.72);
      }

      20% {
        transform: translate(-6px, -6px);
        text-shadow:
          3px 3px 0 rgba(167, 144, 165, 0.72),
          6px 6px 0 rgba(183, 200, 181, 0.7);
      }

      30% {
        transform: translate(-9px, -9px);
        text-shadow:
          3px 3px 0 rgba(167, 144, 165, 0.72),
          6px 6px 0 rgba(183, 200, 181, 0.7),
          9px 9px 0 rgba(197, 235, 195, 0.68);
      }

      40%, 55% {
        transform: translate(-12px, -12px);
        text-shadow:
          3px 3px 0 rgba(167, 144, 165, 0.72),
          6px 6px 0 rgba(183, 200, 181, 0.7),
          9px 9px 0 rgba(197, 235, 195, 0.68),
          12px 12px 0 rgba(84, 65, 78, 0.2);
      }

      70% {
        text-shadow:
          3px 3px 0 rgba(167, 144, 165, 0.72),
          6px 6px 0 rgba(183, 200, 181, 0.7),
          9px 9px 0 rgba(197, 235, 195, 0.68);
      }

      85% {
        text-shadow:
          3px 3px 0 rgba(167, 144, 165, 0.72),
          6px 6px 0 rgba(183, 200, 181, 0.7);
      }
    }

    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 0.6; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    @keyframes sheen {
      0% {
        opacity: 0;
        transform: translateX(0) skewX(-24deg);
      }

      18%,
      72% {
        opacity: 0.95;
      }

      100% {
        opacity: 0;
        transform: translateX(450%) skewX(-24deg);
      }
    }

    @media (max-width: 900px) {
      .wrap {
        padding-top: 56px;
      }
    }

    @media (max-width: 540px) {
      .wrap {
        padding: 48px 18px 64px;
      }

      .hero {
        margin-bottom: 48px;
      }

      .card {
        min-height: auto;
        padding: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-scene"></div>
    <div class="bg-trees"></div>
    <div class="bg-river"></div>
    <div class="bg-overlay"></div>
    <div class="dots"></div>
  </div>

  <div class="wrap">
    <header class="hero">
      <span class="logo"><span class="logo-dot"></span>CataNet</span>
      <h1>Elige un <span class="accent">juego</span></h1>
      
   
    </header>

    <main class="grid" id="catalogo-familias" aria-label="Familias de juegos"></main>

    <footer class="footer">&copy; CataNet &middot; Hecho con ♥</footer>
  </div>
  <script type="module">
    import { familias, estaDisponible } from '/shared/catalog.js';

    const grillaFamilias = document.getElementById('catalogo-familias');

    grillaFamilias.innerHTML = familias
      .map((familia) => crearCardFamilia(familia))
      .join('');

    function crearCardFamilia(familia) {
      const disponible = estaDisponible(familia);
      const claseEstado = disponible ? 'live' : 'soon';
      const textoEstado = disponible ? 'En vivo' : 'Proximamente';
      const accion = disponible
        ? `<a class="btn" href="${familia.ruta}">${familia.accion}<span class="arrow" aria-hidden="true">&rarr;</span></a>`
        : `<span class="placeholder">${familia.accion}</span>`;

      return `
        <article class="card ${disponible ? '' : 'locked'}" ${disponible ? '' : 'aria-disabled="true"'}>
          <div class="card-head">
            <div class="icon" aria-hidden="true">
              <img src="${familia.icono}" alt="">
            </div>
            <span class="badge ${claseEstado}">${disponible ? '<span class="live-dot"></span>' : ''}${textoEstado}</span>
          </div>
          <h2>${familia.titulo}</h2>
          <p>${familia.descripcion}</p>
          <div class="card-footer">${accion}</div>
        </article>
      `;
    }
  </script>
</body>
</html>
