<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CataNet | Hub de juegos</title>
  <link rel="icon" href="/icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#54414e">
  <meta
    name="description"
    content="CataNet es un hub de juegos online para compartir con amigos. Empeza con Co-Wordle y descubri los proximos titulos."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --mint: #c5ebc3;
      --sage: #b7c8b5;
      --mauve: #a790a5;
      --plum: #875c74;
      --eggplant: #54414e;
      --card: #ffffff;
      --radius: 20px;
      --sombra-suave: 0 4px 14px rgba(84, 65, 78, 0.06);
      --sombra-fuerte: 0 22px 50px rgba(84, 65, 78, 0.18);
      --sombra-hover-card: 0 28px 70px rgba(135, 92, 116, 0.34), 0 0 0 1px rgba(135, 92, 116, 0.36), 0 0 34px rgba(197, 235, 195, 0.34);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 400;
      color: var(--eggplant);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      background: #f4edf0;
      background-attachment: fixed;
    }

    a {
      color: inherit;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(135, 92, 116, 0.35);
      outline-offset: 4px;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-scene,
    .bg-overlay {
      position: absolute;
      inset: 0;
    }

    /* La ilustracion pixel art lleva el peso visual y se mueve apenas para dar vida. */
    .bg-scene {
      background:
        linear-gradient(180deg, rgba(255, 250, 246, 0.2) 0%, rgba(255, 250, 246, 0.02) 24%, rgba(84, 65, 78, 0.14) 100%),
        radial-gradient(circle at center, rgba(255, 251, 241, 0.12) 0%, rgba(255, 251, 241, 0) 52%),
        url("/hub/assets/menus/background-4.png") center center / cover no-repeat;
      transform: scale(1.05);
      filter: saturate(0.94) contrast(1.03) brightness(1.01);
    }

    .bg-overlay {
      background:
        linear-gradient(180deg, rgba(244, 237, 240, 0.62) 0%, rgba(244, 237, 240, 0.18) 30%, rgba(244, 237, 240, 0.3) 100%),
        radial-gradient(circle at 50% 18%, rgba(255, 251, 244, 0.52) 0%, rgba(255, 251, 244, 0.1) 32%, rgba(255, 251, 244, 0) 60%);
    }

    .dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(135, 92, 116, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
      opacity: 0.5;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 24px 34px;
      display: flex;
      flex-direction: column;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
      animation: rise 0.8s ease-out both;
    }

    h1 {
      font-size: clamp(40px, 6vw, 64px);
      font-weight: 500;
      color: var(--eggplant);
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 18px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.32);
    }

    .accent {
      display: inline-block;
      color: var(--plum);
      text-shadow:
        3px 3px 0 rgba(167, 144, 165, 0.72),
        6px 6px 0 rgba(183, 200, 181, 0.7),
        9px 9px 0 rgba(197, 235, 195, 0.68),
        12px 12px 0 rgba(84, 65, 78, 0.2);
      animation: sombras-titulo 1.35s ease-in-out infinite;
      transform-origin: center;
      will-change: transform, text-shadow;
    }

    .subtitle {
      font-size: 17px;
      color: rgba(84, 65, 78, 0.84);
      max-width: 600px;
      margin: 0 auto 20px;
      line-height: 1.6;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .hero-meta {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .hero-pill {
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(135, 92, 116, 0.14);
      background: rgba(255, 255, 255, 0.72);
      color: var(--eggplant);
      font-size: 13px;
      box-shadow: 0 6px 18px rgba(84, 65, 78, 0.06);
      backdrop-filter: blur(10px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      min-height: 0;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 280px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(183, 200, 181, 0.88);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--sombra-suave);
      backdrop-filter: blur(16px);
      transition: box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
      overflow: hidden;
      opacity: 0;
      animation: rise 0.7s ease-out forwards;
    }

    .card:nth-child(1) {
      animation-delay: 0.1s;
    }

    .card:nth-child(2) {
      animation-delay: 0.25s;
    }

    .card:nth-child(3) {
      animation-delay: 0.4s;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(197, 235, 195, 0.68), transparent 58%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
      opacity: 0;
      pointer-events: none;
    }

    .card.locked {
      opacity: 0.9;
    }

    .card:hover,
    .card:focus-within {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(135, 92, 116, 0.58);
      box-shadow: var(--sombra-hover-card);
    }

    .card:hover::before,
    .card:focus-within::before {
      opacity: 0.45;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: transparent;
      border: none;
      display: grid;
      place-items: center;
    }

    .icon img {
      width: 64px;
      height: 64px;
      display: block;
      object-fit: contain;
      image-rendering: pixelated;
    }






    .card h2 {
      font-size: 22px;
      font-weight: 500;
      color: var(--eggplant);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .card p {
      font-size: 15px;
      color: var(--mauve);
      line-height: 1.6;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .card-footer {
      margin-top: auto;
      position: relative;
      z-index: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      background: linear-gradient(135deg, var(--plum), var(--eggplant));
      color: #ffffff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 500;
      font-size: 14.5px;
      box-shadow: 0 8px 18px rgba(135, 92, 116, 0.35);
      position: relative;
      overflow: hidden;
      isolation: isolate;
      transition: box-shadow 0.25s ease;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -70%;
      width: 44%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.16),
        rgba(255, 255, 255, 0.72),
        rgba(255, 255, 255, 0.16),
        transparent
      );
      opacity: 0;
      transform: translateX(0) skewX(-24deg);
      pointer-events: none;
    }

    .btn:hover,
    .btn:focus-visible {
      box-shadow: 0 12px 28px rgba(135, 92, 116, 0.42);
    }

    .btn:hover::before,
    .btn:focus-visible::before {
      animation: sheen 0.9s linear both;
    }

    .placeholder {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      color: var(--mauve);
      font-style: italic;
      opacity: 0.88;
    }

    .footer {
      text-align: center;
      margin-top: auto;
      padding-top: 20px;
      font-size: 13px;
      color: rgba(84, 65, 78, 0.74);
      opacity: 0.85;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      animation: rise 0.8s ease-out 0.45s both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sombras-titulo {
      0%, 100% {
        transform: translate(0, 0);
        text-shadow: none;
      }

      10% {
        transform: translate(-3px, -3px);
        text-shadow: 3px 3px 0 rgba(167, 144, 165, 0.72);
      }

      20% {
        transform: translate(-6px, -6px);
        text-shadow:
          3px 3px 0 rgba(167, 144, 165, 0.72),
          6px 6px 0 rgba(183, 200, 181, 0.7);
      }

      30% {
        transform: translate(-9px, -9px);
        text-shadow:
          3px 3px 0 rgba(167, 144, 165, 0.72),
          6px 6px 0 rgba(183, 200, 181, 0.7),
          9px 9px 0 rgba(197, 235, 195, 0.68);
      }

      40%, 55% {
        transform: translate(-12px, -12px);
        text-shadow:
          3px 3px 0 rgba(167, 144, 165, 0.72),
          6px 6px 0 rgba(183, 200, 181, 0.7),
          9px 9px 0 rgba(197, 235, 195, 0.68),
          12px 12px 0 rgba(84, 65, 78, 0.2);
      }

      70% {
        text-shadow:
          3px 3px 0 rgba(167, 144, 165, 0.72),
          6px 6px 0 rgba(183, 200, 181, 0.7),
          9px 9px 0 rgba(197, 235, 195, 0.68);
      }

      85% {
        text-shadow:
          3px 3px 0 rgba(167, 144, 165, 0.72),
          6px 6px 0 rgba(183, 200, 181, 0.7);
      }
    }


    @keyframes sheen {
      0% {
        opacity: 0;
        transform: translateX(0) skewX(-24deg);
      }

      18%,
      72% {
        opacity: 0.95;
      }

      100% {
        opacity: 0;
        transform: translateX(450%) skewX(-24deg);
      }
    }

    @media (max-height: 820px) {
      .wrap {
        padding-top: 18px;
        padding-bottom: 22px;
      }

      .hero {
        margin-bottom: 24px;
      }

      h1 {
        font-size: clamp(36px, 4.8vw, 48px);
      }

      .card {
        min-height: 0;
        padding: 22px;
      }

      .footer {
        padding-top: 12px;
      }
    }

    @media (max-width: 900px) {
      .wrap {
        padding-top: 56px;
      }
    }

    @media (max-width: 540px) {
      .wrap {
        padding: 48px 18px 64px;
      }

      .hero {
        margin-bottom: 48px;
      }

      .card {
        min-height: auto;
        padding: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }

    /* En un telefono la ilustracion apaisada se recorta tanto que casi no se ve
       el paisaje: con cover, de los 1400px de ancho entran unos 370. Por eso hay
       una version vertical de cada fondo, derivada de la misma ilustracion. */
    @media (orientation: portrait) and (max-width: 900px) {
      .bg-scene {
        background-image:
          linear-gradient(180deg, rgba(255, 250, 246, 0.2) 0%, rgba(255, 250, 246, 0.02) 24%, rgba(84, 65, 78, 0.14) 100%),
          radial-gradient(circle at center, rgba(255, 251, 241, 0.12) 0%, rgba(255, 251, 241, 0) 52%),
          
          url("/hub/assets/menus/background-4-vertical.png");
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-scene"></div>
    <div class="bg-overlay"></div>
    <div class="dots"></div>
  </div>

  <div class="wrap">
    <header class="hero">
      <h1>Elige un <span class="accent">juego</span></h1>
    </header>

    <main class="grid" id="catalogo-familias" aria-label="Familias de juegos"></main>

    <footer class="footer">&copy; CataNet &middot; Hecho con ♥</footer>
  </div>
  <script type="module">
    import { familias, estaDisponible } from '/shared/catalog.js';
    import { programarAvion } from '/shared/avion.js';

    const grillaFamilias = document.getElementById('catalogo-familias');

    grillaFamilias.innerHTML = familias
      .map((familia) => crearCardFamilia(familia))
      .join('');

    function crearCardFamilia(familia) {
      const disponible = estaDisponible(familia);
      const accion = disponible
        ? `<a class="btn" href="${familia.ruta}">${familia.accion}<span class="arrow" aria-hidden="true">&rarr;</span></a>`
        : `<span class="placeholder">${familia.accion}</span>`;

      return `
        <article class="card ${disponible ? '' : 'locked'}" ${disponible ? '' : 'aria-disabled="true"'}>
          <div class="card-head">
            <div class="icon" aria-hidden="true">
              <img src="${familia.icono}" alt="">
            </div>
          </div>
          <h2>${familia.titulo}</h2>
          <p>${familia.descripcion}</p>
          <div class="card-footer">${accion}</div>
        </article>
      `;
    }

    // El avioncito con el cartel, arriba del titulo
    programarAvion();
  </script>
</body>
</html>
