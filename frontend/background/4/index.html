<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b8d4b8">
  <title>Las colinas · CataNet</title>
  <link rel="icon" href="/icons/favicon-32.png" type="image/png">
  <link rel="stylesheet" href="/background/style.css">
  <script type="module" src="/background/4/escena.js"></script>
</head>
<body>
  <main class="paisaje" aria-label="Colinas verdes con pinos, un árbol grande y un lago lejano al atardecer." style="--fondo: url('/hub/assets/menus/background-4.png')">
    <div class="ambiente" aria-hidden="true"></div>
    <div class="lienzo">
      <img src="/hub/assets/menus/background-4.png" alt="Colinas verdes con pinos, un árbol grande y un lago lejano al atardecer.">
      <canvas id="escena" width="1400" height="788" aria-hidden="true"></canvas>
    </div>
    <header class="interfaz encabezado">
      <a class="volver" href="/background/">← Paisajes</a>
      <span class="etiqueta"><span class="indicador"></span> FONDO DEL HUB</span>
    </header>
    <footer class="interfaz pie">
      <div class="descripcion">
        <p class="numero">PAISAJES / 04</p>
        <h1>Las colinas.</h1>
        <p id="estado" role="status">Fijate quién anda por las colinas.</p>
      </div>
      <div class="controles" aria-label="Controles del paisaje">
        <button id="pausa" type="button" disabled>Pausar</button>
        <button id="pantalla" type="button" hidden>Pantalla completa</button>
        <button id="ocultar" type="button" aria-pressed="false">Ocultar controles</button>
      </div>
    </footer>
    <button id="mostrar" type="button" hidden>Mostrar controles</button>
    <noscript><p class="aviso">Activá JavaScript para ver el paisaje animado.</p></noscript>
  </main>
</body>
</html>
