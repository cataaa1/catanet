<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CataNet | Buscaminas</title>
  <link rel="icon" href="/icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#54414e">
  <meta
    name="description"
    content="Elegi una version de Buscaminas en CataNet: individual con tres dificultades, cooperativo sobre un mismo tablero o versus contra otra persona."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --rosa-claro: #f7e7f1;
      --lila: #e8d7ee;
      --lila-medio: #a98cba;
      --ciruela: #4a2f4c;
      --ciruela-oscura: #2b1a2f;
      --radius: 20px;
      --sombra-suave: 0 4px 14px rgba(20, 36, 51, 0.08);
      --sombra-hover-card: 0 28px 70px rgba(20, 36, 51, 0.28), 0 0 0 1px rgba(20, 36, 51, 0.24), 0 0 28px rgba(223, 244, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 400;
      color: var(--ciruela);
      overflow-x: hidden;
      background: #f8eff6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(20, 36, 51, 0.22);
      outline-offset: 4px;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-scene,
    .bg-overlay,
    .dots {
      position: absolute;
      inset: 0;
    }

    .bg-scene {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(20, 36, 51, 0.14) 100%),
        url("/hub/assets/menus/background-3.png") center center / cover no-repeat;
      transform: scale(1.06);
      filter: saturate(0.9) contrast(1.03) brightness(0.99);
      animation: escena-flota 12s ease-in-out infinite alternate;
    }

    .bg-overlay {
      background:
        linear-gradient(180deg, rgba(237, 245, 250, 0.72) 0%, rgba(237, 245, 250, 0.24) 30%, rgba(237, 245, 250, 0.34) 100%),
        radial-gradient(circle at 50% 16%, rgba(255, 255, 255, 0.54) 0%, rgba(255, 255, 255, 0) 62%);
    }

    .dots {
      background-image: radial-gradient(circle, rgba(20, 36, 51, 0.1) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
      opacity: 0.4;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1160px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 24px 34px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 9px 16px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
      color: var(--ciruela);
      background: rgba(255, 255, 255, 0.62);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(20, 36, 51, 0.08);
      backdrop-filter: blur(12px);
    }

    .hero {
      text-align: center;
      margin-bottom: 28px;
      animation: rise 0.8s ease-out both;
    }

    h1 {
      font-size: clamp(40px, 5.4vw, 62px);
      font-weight: 500;
      color: var(--ciruela-oscura);
      letter-spacing: -0.035em;
      line-height: 1.02;
      margin-bottom: 12px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.42);
    }

    .accent {
      background: linear-gradient(120deg, #6d3a58, #8a5473);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      font-size: 17px;
      color: rgba(33, 53, 71, 0.84);
      max-width: 650px;
      margin: 0 auto;
      line-height: 1.6;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      min-height: 0;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(203, 231, 239, 0.88);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--sombra-suave);
      backdrop-filter: blur(16px);
      transition: box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
      overflow: visible;
      opacity: 0;
      animation: rise 0.7s ease-out forwards;
    }

    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3) { animation-delay: 0.3s; }
    .card:nth-child(4) { animation-delay: 0.4s; }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(223, 244, 255, 0.74), transparent 58%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0));
      opacity: 0;
      pointer-events: none;
    }

    .card.locked {
      opacity: 0.9;
    }

    .card:hover,
    .card:focus-within {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(30, 79, 117, 0.46);
      box-shadow: var(--sombra-hover-card);
    }

    .card:hover::before,
    .card:focus-within::before {
      opacity: 0.45;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
    }

    .icon img {
      width: 56px;
      height: 56px;
      display: block;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }





    .card h2 {
      font-size: 21px;
      font-weight: 500;
      color: var(--ciruela-oscura);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    .card p {
      font-size: 14px;
      color: var(--lila-medio);
      line-height: 1.5;
      margin-bottom: 14px;
      position: relative;
      z-index: 1;
    }

    .mode-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
    }

    .meta-pill {
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(20, 36, 51, 0.1);
      color: var(--ciruela);
    }

    .card-footer {
      margin-top: auto;
      position: relative;
      z-index: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      background: linear-gradient(135deg, #a94f74, var(--ciruela-oscura));
      color: #ffffff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 500;
      font-size: 14.5px;
      box-shadow: 0 8px 18px rgba(20, 36, 51, 0.22);
      position: relative;
      overflow: hidden;
      isolation: isolate;
      transition: box-shadow 0.25s ease;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -70%;
      width: 44%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.16), transparent);
      opacity: 0;
      transform: translateX(0) skewX(-24deg);
      pointer-events: none;
    }

    .btn:hover,
    .btn:focus-visible {
      box-shadow: 0 12px 28px rgba(20, 36, 51, 0.28);
    }

    .btn:hover::before,
    .btn:focus-visible::before {
      animation: sheen 0.9s linear both;
    }

    .placeholder {
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      color: var(--lila-medio);
      font-style: italic;
      opacity: 0.88;
    }

    .footer {
      text-align: center;
      margin-top: auto;
      padding-top: 20px;
      font-size: 13px;
      color: rgba(33, 53, 71, 0.7);
      opacity: 0.85;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      animation: rise 0.8s ease-out 0.45s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes escena-flota {
      0% { transform: scale(1.06) translate3d(-8px, 0, 0); }
      100% { transform: scale(1.08) translate3d(10px, -18px, 0); }
    }


    @keyframes sheen {
      0% { opacity: 0; transform: translateX(0) skewX(-24deg); }
      18%, 72% { opacity: 0.95; }
      100% { opacity: 0; transform: translateX(450%) skewX(-24deg); }
    }

    @media (max-width: 980px) and (min-width: 761px) {
      .wrap {
        padding: 18px 20px 26px;
      }

      .topbar {
        margin-bottom: 8px;
      }

      .hero {
        margin-bottom: 22px;
      }

      h1 {
        font-size: clamp(38px, 5vw, 48px);
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 15px;
        line-height: 1.45;
      }

      .grid {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .card {
        padding: 18px;
      }

      .card-head {
        margin-bottom: 10px;
      }

      .icon,
      .icon img {
        width: 46px;
        height: 46px;
      }

      .card h2 {
        font-size: 19px;
      }

      .card p {
        font-size: 13px;
        line-height: 1.42;
        margin-bottom: 11px;
      }

      .mode-meta {
        gap: 6px;
        margin-bottom: 14px;
      }

      .meta-pill {
        padding: 5px 10px;
        font-size: 11px;
      }

      .btn {
        padding: 10px 18px;
        font-size: 13.5px;
      }

      .footer {
        padding-top: 14px;
      }
    }

    @media (max-width: 760px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }

      .wrap {
        height: auto;
        min-height: 100vh;
        padding: 24px 18px 44px;
      }

      .topbar {
        margin-bottom: 26px;
      }

      .hero {
        margin-bottom: 36px;
      }

      .card {
        min-height: auto;
        padding: 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }

    /* En un telefono la ilustracion apaisada se recorta tanto que casi no se ve
       el paisaje: con cover, de los 1400px de ancho entran unos 370. Por eso hay
       una version vertical de cada fondo, derivada de la misma ilustracion. */
    @media (orientation: portrait) and (max-width: 900px) {
      .bg-scene {
        background-image:
          linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(20, 36, 51, 0.14) 100%),
          
          url("/hub/assets/menus/background-3-vertical.png");
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg-scene"></div>
    <div class="bg-overlay"></div>
    <div class="dots"></div>
  </div>

  <div class="wrap">
    <nav class="topbar" aria-label="Navegacion">
      <a class="btn-volver" href="/hub/">&larr; Volver al hub</a>
    </nav>

    <header class="hero">
      <h1>Versiones de <span class="accent">Buscaminas</span></h1>
      <p class="subtitle">
        Despeja el tablero deduciendo donde estan las minas. Solo, en equipo sobre un mismo tablero, o contra otra persona.
      </p>
    </header>

    <main class="grid" id="catalogo-modos" aria-label="Versiones de Buscaminas"></main>

    <footer class="footer">&copy; CataNet &middot; Hecho con carino</footer>
  </div>

  <script type="module">
    import { estaDisponible, obtenerModosPorFamilia } from '/shared/catalog.js';
    import { programarAvion } from '/shared/avion.js';

    const grillaModos = document.getElementById('catalogo-modos');
    const modosBuscaminas = obtenerModosPorFamilia('buscaminas');

    grillaModos.innerHTML = modosBuscaminas
      .map((modo) => crearCardModo(modo))
      .join('');

    function crearCardModo(modo) {
      const disponible = estaDisponible(modo);
      const textoOnline = modo.online ? 'Online' : 'Local';
      const accion = disponible
        ? `<a class="btn" href="${modo.ruta}">${modo.accion}<span class="arrow" aria-hidden="true">&rarr;</span></a>`
        : `<span class="placeholder">${modo.accion} pronto</span>`;

      return `
        <article class="card ${disponible ? '' : 'locked'}" ${disponible ? '' : 'aria-disabled="true"'}>
          <div class="card-head">
            <div class="icon" aria-hidden="true">
              <img src="${modo.icono}" alt="">
            </div>
          </div>
          <h2>${modo.titulo}</h2>
          <p>${modo.descripcion}</p>
          <div class="mode-meta" aria-label="Datos del modo">
            <span class="meta-pill">${modo.jugadores}</span>
            <span class="meta-pill">${textoOnline}</span>
            <span class="meta-pill">${etiquetaTipo(modo.tipo)}</span>
          </div>
          <div class="card-footer">${accion}</div>
        </article>
      `;
    }

    function etiquetaTipo(tipo) {
      const etiquetas = {
        solo: 'Individual',
        coop: 'Co-op',
        versus: 'Versus',
        custom: 'Custom',
        cpu: 'CPU'
      };

      return etiquetas[tipo] || tipo;
    }

    // El avioncito con el cartel, arriba del titulo
    programarAvion();
  </script>
</body>
</html>
